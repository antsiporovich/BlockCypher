# Template, not a real secret - copy to secret.yaml (already .gitignore'd),
# fill in real values, and apply that instead. Never commit actual
# credentials or tokens.
apiVersion: v1
kind: Secret
metadata:
  name: icmarkets-api-secrets
  namespace: icmarkets
type: Opaque
stringData:
  ConnectionStrings__Default: "Server=mssql,1433;Database=BlockCypher;User Id=sa;Password=CHANGE_ME_Strong_Pass123!;TrustServerCertificate=True;Encrypt=True"
  MSSQL_SA_PASSWORD: "CHANGE_ME_Strong_Pass123!"
  # optional - raises the anonymous BlockCypher rate limit, see README
  BlockCypher__Token: ""
