name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ICMarkets.BlockCypher.slnx

      - name: Build
        run: dotnet build ICMarkets.BlockCypher.slnx --configuration Release --no-restore

      - name: Test
        env:
          REQUIRE_SQLSERVER: "1"
          REQUIRE_RABBITMQ: "1"
        run: >
          dotnet test ICMarkets.BlockCypher.slnx
          --configuration Release --no-build
          --filter "FullyQualifiedName!~PerformanceTests"
