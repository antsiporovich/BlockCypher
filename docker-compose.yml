services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "My_Strong_Pass123!"
      MSSQL_PID: "Developer"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/ICMarkets.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: "SqlServer"
      ConnectionStrings__Default: "Server=db,1433;Database=BlockCypher;User Id=sa;Password=My_Strong_Pass123!;TrustServerCertificate=True;Encrypt=True"
      BlockCypher__BaseUrl: "https://api.blockcypher.com/v1/"
      # optional: anonymous BlockCypher access is rate-limited (429 "Limits
      # reached" once the quota is used up, honored via Retry-After by the
      # resilience handler in Infrastructure/DependencyInjection.cs). Set a
      # free token (https://accounts.blockcypher.com/) in the host shell
      # before `docker compose up` to raise the limit - unset/empty keeps
      # anonymous access, same as before.
      BlockCypher__Token: "${BlockCypher__Token:-}"
      Outbox__Enabled: "true"
      Outbox__HostName: "rabbitmq"
      # the gateway sits in front: trust X-Forwarded-* only from the compose network's
      # private ranges (Docker assigns user networks from 172.16/12 or 192.168/16),
      # not from anyone who can reach port 8080 directly.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: "172.16.0.0/12"
      ForwardedHeaders__KnownNetworks__1: "192.168.0.0/16"

  rabbitmq:
    # pinned, not :3-management - a floating major tag means `docker compose
    # up --build` can silently pull a newer RabbitMQ later; same reasoning as
    # the pinned SQL Server image above. Verify this still resolves on Docker
    # Hub before relying on it long-term.
    image: rabbitmq:4.2.7-management
    # Durable state (persistent messages, the durable queue) lives under /var/lib/rabbitmq in a
    # directory named after the NODE, and the node name defaults to rabbit@<hostname>. A
    # recreated container gets a random hostname = a different node = a fresh empty store:
    # acked messages the outbox already marked processed would silently vanish. So BOTH are
    # pinned: a stable hostname AND a named volume. `docker compose down` (without -v) keeps it.
    hostname: rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # optional API Gateway (YARP) - a thin reverse proxy in front of `api`,
  # the task's own optional item. `api` stays reachable directly on 8080;
  # this just demonstrates the gateway shape on top of it.
  gateway:
    build:
      context: .
      dockerfile: src/ICMarkets.Gateway/Dockerfile
    depends_on:
      - api
    ports:
      - "8081:8081"
    environment:
      ReverseProxy__Clusters__api__Destinations__destination1__Address: "http://api:8080/"

  prometheus:
    build:
      context: ./observability/prometheus
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    build:
      context: ./observability/grafana
      dockerfile: Dockerfile
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  mssql-data:
  rabbitmq-data:
